AUGMENTATION:
  BRIGHTNESS: true
  BRIGHTNESS_MAX_DELTA: 0.8
  CONTRAST: true
  CONTRAST_MAX_DELTA: 0.8
  HUE: true
  HUE_MAX_DELTA: 0.2
  RANDOM_CROP: true
  RANDOM_FLIP: false   # videos are pre-flipped to virtual right-handed; do NOT re-randomize
  SATURATION: true
  SATURATION_MAX_DELTA: 0.8
  STRENGTH: 1.0
  COLOR_NORM: true
  COLOR_JITTER: true
  GRAYSCALE: true
CHECKPOINT:
  SAVE_INTERVAL: 50
DATA:
  ADDITION_TRAINSET: false
  CONSISTENT_OFFSET: 0.2
  CONTEXT_STRIDE: 2
  FRACTION: 1.0
  FRAME_LABELS: true
  NUM_CONTEXTS: 1
  NUM_WORKERS: 4
  SAMPLE_ALL_STRIDE: 1
  SAMPLING_REGION: 1.5
  SAMPLING_STRATEGY: time_augment
  TRAIN_NAME: train
  TEST_NAME: test
DATASETS:
- tennis
EVAL:
  BATCH_SIZE: 1
  CLASSIFICATION_FRACTIONS:
  - 0.1
  - 0.5
  - 1.0
  FRAMES_PER_BATCH: 1000
  KENDALLS_TAU_COMPUTE_LABELS: 0
  KENDALLS_TAU_DISTANCE: sqeuclidean
  KENDALLS_TAU_STRIDE: 2
  NUM_FRAMES: 240
  RETRIEVAL_KS:
  - 5
  - 10
  - 15
  TASKS:
  - kendalls_tau
  - retrieval
  VAL_INTERVAL: 50
IMAGE_SIZE: 224
LOGDIR: /workspace/VideoAlignment_forked/result/tennis_carl
LOGGING:
  REPORT_INTERVAL: 20
MAX_TEMPERATURE: 0.1
MODEL:
  EMBEDDER_TYPE: transformer
  BASE_MODEL:
    NETWORK: Resnet50_byol
    LAYER: 3
    FRAMES_PER_BATCH: 40
  TRAIN_BASE: frozen
  EMBEDDER_MODEL:
    HIDDEN_SIZE: 256
    D_FF: 1024
    NUM_HEADS: 8
    NUM_LAYERS: 3
    CONV_LAYERS:
    - [256, 3, 1]
    - [256, 3, 1]
    FLATTEN_METHOD: max_pool
    FC_LAYERS:
    - [256, true]
    - [256, true]
    CAPACITY_SCALAR: 2
    EMBEDDING_SIZE: 128
    FC_DROPOUT_RATE: 0.1
    USE_BN: true
  L2_NORMALIZE: true
  PROJECTION: true
  PROJECTION_HIDDEN_SIZE: 128
  PROJECTION_SIZE: 128
NUM_GPUS: 8
OPTIMIZER:
  GRAD_CLIP: 10
  LR:
    DECAY_TYPE: cosine
    FINAL_LR: 0.0
    INITIAL_LR: 0.0001
    NUM_WARMUP_STEPS: 1
    WARMUP_LR: 0.0001
  TYPE: AdamOptimizer
  WEIGHT_DECAY: 1.0e-05
PATH_TO_DATASET: /workspace/dataset/tennis_alignment
SCL:
  LABEL_VARIENCE: 10.0
  NEGATIVE_TYPE: single_noself
  POSITIVE_TYPE: gauss
  POSITIVE_WINDOW: 5
  SOFTMAX_TEMPERATURE: 0.1
SSL: true
TCC:
  CYCLE_LENGTH: 2
  FRACTION: 1.0
  HUBER_DELTA: 0.1
  LABEL_SMOOTHING: 0.1
  LOSS_TYPE: regression_mse_var
  NORMALIZE_INDICES: true
  SIMILARITY_TYPE: l2
  SOFTMAX_TEMPERATURE: 0.1
  VARIANCE_LAMBDA: 0.001
TRAIN:
  BATCH_SIZE: 2
  MAX_EPOCHS: 300
  NUM_FRAMES: 26
  SCL_BATCH_SIZE: 6
TRAINING_ALGO: scl
VARIANCE_LAMBDA: 0.001
VISUALIZATION_DIR: /workspace/VideoAlignment_forked/result/tennis_carl/visualization
